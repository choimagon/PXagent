name: Publish verified installers
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop installers run ID
        required: true
        type: string
      repair_linux_x64:
        description: Add Linux x64 DEB and AppImage to the existing release
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful installer build
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const run=JSON.parse(fs.readFileSync('build-run.json','utf8'));
          if(run.conclusion!=='success'||run.path!=='.github/workflows/desktop-build.yml'||run.repository.full_name!==process.env.GH_REPO)throw Error('A successful installer build from this repository is required');
          fs.appendFileSync(process.env.GITHUB_ENV,`BUILD_SHA=${run.head_sha}\n`);
          JS
      - name: Check out verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - name: Publish complete installers and checksums
        run: |
          RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          if [ "${{ inputs.repair_linux_x64 }}" = "true" ]; then
            app="PXagents-$(node -p 'require("./package.json").version')-linux-x64.AppImage"
            deb="PXagents-$(node -p 'require("./package.json").version')-linux-x64.deb"
            test -s "release-assets/$app"
            test -s "release-assets/$deb"
            mkdir existing-assets
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir existing-assets
            (cd release-assets && sha256sum "$app" "$deb") > linux-checksums
            python3 - <<'PYTHON'
          from pathlib import Path
          checksums={}
          for file in ['existing-assets/SHA256SUMS','linux-checksums']:
              for line in Path(file).read_text().splitlines():
                  digest,name=line.split(maxsplit=1)
                  checksums[name.strip()]=digest
          Path('release-assets/SHA256SUMS').write_text(''.join(f'{checksums[name]}  {name}\n' for name in sorted(checksums)))
          PYTHON
            gh release upload "$RELEASE_TAG" "release-assets/$app" "release-assets/$deb" release-assets/SHA256SUMS --clobber
            exit 0
          fi
          for file in PXagents-windows-x64.exe PXagents-windows-arm64.exe PXagents-mac-x64.zip PXagents-mac-arm64.zip PXagents-linux-x64.tar.gz PXagents-linux-arm64.tar.gz; do
            test -s "release-assets/$file"
          done
          cp install.sh release-assets/install.sh
          cd release-assets
          sha256sum * > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PXagents $RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.appendFileSync(`${process.env.GITHUB_WORKSPACE}/RELEASE_NOTES.md`, `\n\n## 설치파일 빌드 기준\n\n[${process.env.BUILD_SHA}](https://github.com/${process.env.GH_REPO}/commit/${process.env.BUILD_SHA})\n`);
          JS
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
